<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inscripción · 25 Aniversario A.A.Z Aerocontrolados</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main>
    <img class="logo" src="logo-aaz.png" alt="Logo A.A.Z Aerocontrolados">
    <h1><span>Invitación</span>25 Aniversario A.A.Z Aerocontrolados</h1>
    <p class="sub">📅 17 de octubre a las 9 am · ¡Te esperamos!</p>

    <section class="card">
      <div class="price">
        <span>Valor de la inscripción<br>
          <small style="color:var(--mut)">Menores de 12 años: $10.000</small>
        </span>
        <b>$20.000</b>
      </div>
      <form id="f">
        <div class="two">
          <div><label for="n">Nombre</label><input id="n" autocomplete="given-name" required></div>
          <div><label for="a">Apellido</label><input id="a" autocomplete="family-name" required></div>
        </div>
          <label for="m">Acompañantes</label>
          <input id="m" type="number" min="0" max="20" value="0">

          <label class="chk"><input type="checkbox" id="lm"> Llevo acompañantes menores de 12 años</label>
          <div id="boxMenores" style="display:none">
            <label for="k">Acompañantes menores</label>
            <input id="k" type="number" min="0" max="20" value="0">
          </div>
          <div class="total"><span>Total a abonar</span><b id="tot">$20.000</b></div>
          <button class="full" id="send" type="submit">Inscribirme</button>
      </form>
      <div class="msg" id="msg"></div>
    </section>
  </main>
  <script src="db.js"></script>
  <script src="app.js"></script>
</body>

</html>
